apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditcardfraud-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: creditcardfraud-app
  template:
    metadata:
      labels:
        app: creditcardfraud-app
    spec:
      containers:
      - name: creditcardfraud-app
        image: placeholder-image:latest  
        ports:
        - containerPort: 8501
