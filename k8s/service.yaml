apiVersion: v1
kind: Service
metadata:
  name: mlops-service
  labels:
    app: creditcardfraud-app
spec:
  type: NodePort
  selector:
    app: creditcardfraud-app
  ports:
    - name: streamlit-ui
      port: 8501
      targetPort: 8501
      nodePort: 30001
    - name: prometheus-metrics
      port: 8000
      targetPort: 8000
      nodePort: 30002
