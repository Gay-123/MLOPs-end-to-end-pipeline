name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mlops-pipeline
  ACR_NAME: mlopsacr
  RESOURCE_GROUP: mlops-rg
  AKS_NAME: fraud-mlops-aks
  TF_DIR: infrastructure

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # --- Azure Login ---
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # --- Terraform Init & Apply ---
    - name: Set Azure Credentials for Terraform
      run: |
        echo "ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
        echo "ARM_CLIENT_SECRET=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
        echo "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
        echo "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
 

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.7.2

    - name: Terraform Init
      working-directory: ${{ env.TF_DIR }}
      run: terraform init
     
    - name: Terraform Validate
      working-directory: ${{ env.TF_DIR }}
      run: terraform validate

    - name: Terraform Plan
      working-directory: ${{ env.TF_DIR }}
      run: terraform plan

    - name: Terraform Apply
      working-directory: ${{ env.TF_DIR }}
      run: terraform apply -auto-approve

    # --- Build & Push Docker Image to ACR ---
    - name: Azure ACR Login
      run: az acr login --name ${{ env.ACR_NAME }}

    - name: Build Docker Image
      run: docker build -t ${{ env.IMAGE_NAME }} .

    - name: Tag Docker Image
      run: docker tag ${{ env.IMAGE_NAME }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

    - name: Push Docker Image
      run: docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

    # --- Deploy to AKS ---
    - name: Get AKS credentials
      run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_NAME }} --overwrite-existing

    - name: Update image in K8s manifest
      run: |
        sed -i "s|image: .*|image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest|" k8s/deployment.yaml

    - name: Deploy Kubernetes manifests
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml

    - name: Verify Deployment
      run: kubectl get pods -o wide
