name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mlops-pipeline
  ACR_NAME: mlopsacr2025gayathri
  RESOURCE_GROUP: mlopsrggayathri01
  AKS_NAME: mlopsaksfrauddetect01
  TF_DIR: infrastructure

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Azure login using service principal
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.2

      # Export Terraform variables from secrets
      - name: Export TF_VARs
        run: |
          echo "TF_VAR_client_id=${{ secrets.ARM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_client_secret=${{ secrets.ARM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "TF_VAR_tenant_id=${{ secrets.ARM_TENANT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      # Terraform init/validate/plan/apply
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      # ACR login
      - name: Azure ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      # Docker build and push
      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Tag Docker Image
        run: docker tag ${{ env.IMAGE_NAME }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker Image
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # Get AKS credentials
      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_NAME }} --overwrite-existing

      # Delete existing imagePullSecret (optional cleanup)
      - name: Delete existing imagePullSecret
        continue-on-error: true
        run: kubectl delete secret acr-auth --namespace=default

      # Create imagePullSecret using GitHub Secrets
      - name: Create imagePullSecret
        run: |
          kubectl create secret docker-registry acr-auth \
            --docker-server=${{ secrets.ACR_SERVER }} \
            --docker-username=${{ secrets.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            --namespace=default

      # Update image in Kubernetes manifest
      - name: Update image in K8s manifest
        run: |
          sed -i "s|image: .*|image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest|" k8s/deployment.yaml

      # Deploy to AKS
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # Verify deployment
      - name: Verify Deployment
        run: kubectl get pods -o wide
